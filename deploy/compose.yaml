services:
  reservas:
    build:
      context: ../
    image: sjma-reserves:local
    container_name: sjma-reserves
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 0.5
    environment:
      TZ: Europe/Madrid
      SJMA_BIND_HOST: 0.0.0.0
      SJMA_PORT: "8766"
      SJMA_DATA_BACKEND: supabase
      SJMA_PUBLIC_ORIGIN: ${SJMA_PUBLIC_ORIGIN:?Defineix el domini HTTPS}
      SJMA_ENABLE_BOOKINGS: ${SJMA_ENABLE_BOOKINGS:-0}
    volumes:
      - ../../.private:/app/.private:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8766/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${SJMA_PROXY_NETWORK:-docuseal_default}
